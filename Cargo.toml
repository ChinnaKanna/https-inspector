[package]
name = "https-inspector"
version = "0.1.0"
edition = "2021"
authors = ["gk"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http'] }
worker-macros = { version = "0.8", features = ['http'] }
http = "1.3"
serde = { version = "1.0.229", features = ["derive"] }
